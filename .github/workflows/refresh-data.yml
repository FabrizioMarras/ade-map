name: Refresh programme

# Re-runs the data pipeline so new events, line-up changes and sold-out flags reach the
# live app on their own. GitHub runs scheduled workflows late and irregularly (often hours
# apart), so the schedule fires often and each run checks how old the published programme is
# (scripts/refresh-due.mjs): refreshed when older than 20 h before ADE week, older than 2 h
# from 19 to 26 Oct, never from 27 Oct. Manual runs (Actions tab) always refresh.
#
# The redeploy is data-only (ci.yml with data_only: no test suite). If it fails, this run fails,
# and the next run redeploys: it compares the live site's programme with the data branch.
on:
  schedule:
    - cron: '7,37 * * * *' # off the top of the hour, where GitHub's scheduler is busiest
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the event count dropped by more than 20%'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: refresh-data, cancel-in-progress: false }

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      # Deploy when this run published a programme, or the live site isn't showing the
      # published one (a failed or skipped deploy earlier).
      deploy: ${{ steps.publish.outputs.published == 'true' || steps.live.outputs.behind == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Start from the last published programme
        id: data
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git checkout FETCH_HEAD -- public/data
            echo "generated=$(node -p "require('./public/data/ade-2026.meta.json').generated")" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether this run is due
        id: gate
        run: node scripts/refresh-due.mjs public/data/ade-2026.meta.json ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}

      - name: Check the live site shows the published programme
        id: live
        if: steps.gate.outputs.due != 'true' && steps.data.outputs.generated != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.data.outputs.generated }}
        run: |
          site=$(gh api "repos/${{ github.repository }}/pages" -q .html_url) ||
            site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          # The query string gets past the CDN cache.
          body=$(curl -fsS "${site%/}/data/ade-2026.meta.json?t=$(date +%s)") || body='{}'
          live=$(echo "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).generated??'')}catch{console.log('')}})")
          echo "Live site: ${live:-(unreadable)} · data branch: $PUBLISHED"
          if [ "$live" != "$PUBLISHED" ]; then
            echo "::warning::The live site is behind the data branch: redeploying"
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.due == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.gate.outputs.due == 'true'
        run: npm ci

      - name: Restore the page cache
        if: steps.gate.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-

      - name: Run the pipeline
        if: steps.gate.outputs.due == 'true'
        run: |
          npm run data:program
          npm run data:pages
          npm run data:geocode
          node scripts/build-data.mjs ${{ inputs.force && '--force' || '' }}

      - name: Publish to the data branch
        id: publish
        if: steps.gate.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One commit on an orphan branch, force-pushed: the data branch always holds just
          # the current programme, and main's history stays free of data churn.
          pub=$(mktemp -d)
          mkdir -p "$pub/public"
          cp -r public/data "$pub/public/"
          cd "$pub"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Programme refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      data_only: true
    permissions:
      contents: read
      pages: write
      id-token: write
