name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the programme refresh to redeploy with the new data.
  workflow_call:
    inputs:
      data_only:
        description: 'Skip lint, type check and tests: only check the data, build and deploy'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    # Data-only deploys (from the refresh) don't run the suite: the code on main already passed
    # it, and tests pinned to the snapshot must never hold back a new programme.
    name: ${{ inputs.data_only && 'build (data only)' || 'test' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - if: ${{ !inputs.data_only }}
        run: npm run lint
      - if: ${{ !inputs.data_only }}
        run: npm run check
      # Tests run against the programme snapshot committed on main, so a changed live
      # programme can never break them.
      - if: ${{ !inputs.data_only }}
        run: npm test
      - if: ${{ !inputs.data_only }}
        run: npx playwright install --with-deps chromium
      - if: ${{ !inputs.data_only }}
        run: npm run test:e2e

      - name: Use the latest published programme
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git checkout FETCH_HEAD -- public/data
          elif [ "${{ inputs.data_only }}" = "true" ]; then
            echo '::error::No data branch to deploy'; exit 1
          else
            echo 'No data branch yet: deploying the snapshot from main.'
          fi
      - name: Check the programme
        run: node scripts/check-data.mjs public/data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
