<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ADE 2026 Map</title>
    <meta name="description" content="Every Amsterdam Dance Event 2026 party on a map of Amsterdam." />
    <meta name="theme-color" content="#f2f3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ADE Map" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first render; system fonts are the fallback. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <link rel="preload" href="./data/ade-2026.core.json" as="fetch" crossorigin />
    <script>
      // Safety net: if the app bundle fails to load (e.g. a stale page pointing at files from
      // a previous deploy), drop the service worker and caches and reload once.
      window.addEventListener(
        'error',
        function (e) {
          var el = e.target;
          if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
          var url = el.src || el.href || '';
          if (url.indexOf('/assets/') < 0) return;
          try {
            if (sessionStorage.getItem('ade-recovered')) return;
            sessionStorage.setItem('ade-recovered', '1');
          } catch (_) {
            return;
          }
          var regs = navigator.serviceWorker
            ? navigator.serviceWorker.getRegistrations()
            : Promise.resolve([]);
          var keys = window.caches ? caches.keys() : Promise.resolve([]);
          Promise.all([regs, keys])
            .then(function (r) {
              return Promise.all(
                r[0]
                  .map(function (x) {
                    return x.unregister();
                  })
                  .concat(
                    r[1].map(function (k) {
                      return caches.delete(k);
                    }),
                  ),
              );
            })
            .finally(function () {
              location.reload();
            });
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
